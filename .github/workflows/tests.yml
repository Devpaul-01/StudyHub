# .github/workflows/tests.yml
#
# Runs both test suites as separate jobs against SQLite + fakeredis, per
# the confirmed decisions in INTEGRATION_TESTS_BUNDLE.md and
# UNIT_TEST_IMPLEMENTATION_PLAN.md: no Postgres service container, no
# real Redis service container, no real AI provider calls, no real RQ
# worker process. The two jobs run independently (separate dependency
# installs, separate Python versions) rather than sharing one job, since
# that's how they were originally configured and neither depends on the
# other's setup.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    env:
      # Required at import time by config.py's Config class (raises
      # ValueError at class-definition time if unset) — same values the
      # repo-root conftest.py and tests/integration/conftest.py already
      # default to locally.
      SECRET_KEY: test-secret-key-not-for-production
      DATABASE_NEW_URL: "sqlite:///:memory:"
      SCHEDULER_ENABLED: "false"
      # Points at a dead port on purpose — extensions.py's
      # _create_redis_client() fails open (redis_client = None) at import
      # time when unreachable, and every Redis-touching test explicitly
      # monkeypatches in fakeredis via the fakeredis_client fixture
      # instead of relying on this URL being real.
      REDIS_URL: "redis://localhost:6399/0"
      RATE_LIMIT_ENABLED: "true"
      FLASK_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run integration test suite
        run: |
          pytest tests/integration \
            --cov=services \
            --cov=routes.student.helpers \
            --cov-report=term-missing \
            --cov-report=xml \
            -ra

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  unit-tests:
    runs-on: ubuntu-latest

    env:
      # config.py raises ValueError at IMPORT time if SECRET_KEY or
      # DATABASE_NEW_URL are unset (confirmed directly in config.py, and
      # flagged explicitly in SUPPLEMENTARY_AGENT_INSTRUCTIONS.md §1.3) —
      # these must exist before pytest imports anything, hence being set
      # here at the job-env level rather than relying solely on the
      # repo-root conftest.py's own os.environ.setdefault(...) calls.
      # DATABASE_NEW_URL is never actually connected to: the test app
      # fixture (tests/unit/conftest.py) overrides
      # SQLALCHEMY_DATABASE_URI to sqlite:///:memory: before db.create_all()
      # runs.
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_NEW_URL: "sqlite:///:memory:"
      SCHEDULER_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      REDIS_URL: "redis://localhost:6399/0"
      FLASK_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit test suite
        run: |
          pytest tests/unit \
            --cov=services \
            --cov=routes.student.helpers \
            --cov-report=term-missing \
            -v

      # Coverage is measured and reported (per UNIT_TEST_IMPLEMENTATION_PLAN.md
      # §13) but is informational only for this pass — not enforced as a
      # hard gate. See §13's own reasoning for why a pre-committed
      # percentage threshold isn't set until the full P0+P1 suite's real
      # achieved coverage has actually been measured once.
