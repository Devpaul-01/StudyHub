# .github/workflows/integration-tests.yml
#
# Runs the integration suite (tests/integration/) against SQLite +
# fakeredis, per the confirmed decisions in INTEGRATION_TESTS_BUNDLE.md:
# no Postgres service container, no real Redis service container, no
# real AI provider calls, no real RQ worker process. The unit suite
# (tests/unit/) is run in the same job since both share one dependency
# install and one pytest config.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Required at import time by config.py's Config class (raises
      # ValueError at class-definition time if unset) — same values the
      # repo-root conftest.py and tests/integration/conftest.py already
      # default to locally.
      SECRET_KEY: test-secret-key-not-for-production
      DATABASE_NEW_URL: "sqlite:///:memory:"
      SCHEDULER_ENABLED: "false"
      # Points at a dead port on purpose — extensions.py's
      # _create_redis_client() fails open (redis_client = None) at import
      # time when unreachable, and every Redis-touching test explicitly
      # monkeypatches in fakeredis via the fakeredis_client fixture
      # instead of relying on this URL being real.
      REDIS_URL: "redis://localhost:6399/0"
      RATE_LIMIT_ENABLED: "true"
      FLASK_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit + integration test suite
        run: |
          pytest tests/integration \ tests/unit \
            --cov=services \
            --cov=routes.student.helpers \
            --cov-report=term-missing \
            --cov-report=xml \
            -ra

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
