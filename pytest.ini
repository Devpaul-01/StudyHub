
[pytest]
minversion = 7.0
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    slow: marks a test as slow (deselect with -m "not slow")
    integration: marks a test as an integration test (real create_app(), real HTTP test client, real SQLite DB, fakeredis) — deselect with -m "not integration" to run only the fast unit suite

