# Batch 5: this project had never run `flask db init` before — Migrate()
# was instantiated in app.py (migrate = Migrate(); migrate.init_app(app, db))
# but no migrations/ directory existed, so every schema change until now
# was made by hand-editing models.py and presumably running db.create_all()
# or applying raw SQL directly. Per instruction, new schema changes
# (MessageReport, below) go through Alembic from here on rather than
# continuing that way. This is the standard Flask-Migrate/Alembic
# scaffold (the same files `flask db init` generates), hand-written here
# since running that command needs a live app + database connection this
# sandbox doesn't have.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
