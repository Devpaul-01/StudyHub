        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { connection_id: { type: integer }, connected_user: { $ref: '#/components/schemas/UserSummary' } } }
        '400':
          description: Not found, not authorized, or not pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

