  /student/comments/{comment_id}:
    patch:
      tags: [Comments]
      summary: Edit a comment
      description: Author-only.
      parameters: [{ name: comment_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text_content]
              properties:
                text_content: { type: string }
      responses:
        '200':
          description: Updated, or "No changes made".
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { edited_at: { type: string, format: date-time } } }
        '400':
          description: Empty text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Comment or its post not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Comments]
      summary: Delete a comment
      description: Author-only. Soft delete — text becomes "[deleted]", structure preserved for replies.
      parameters: [{ name: comment_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/comments/create:
    post:
      tags: [Comments]
      summary: Create a comment or reply
      description: |
        Max depth is 1 (top-level comments plus one level of replies — replying to a reply is
        rejected). Rate-limited by an in-app spam check (30 comments/hour) beyond WRITE_HEAVY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id, text_content]
              properties:
                post_id: { type: integer }
                text_content: { type: string, maxLength: 5000 }
                parent_id: { type: integer, nullable: true, description: "Omit for a top-level comment" }
                resources:
                  type: array
                  items:
                    oneOf:
                      - { type: string }
                      - { $ref: '#/components/schemas/Resource' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { comment: { $ref: '#/components/schemas/Comment' } } }
        '400':
          description: Missing post_id/text, text too long, replying to a locked post, or exceeding max reply depth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Post or parent comment not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Spam check triggered (30 comments/hour).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/comments:
    get:
      tags: [Comments]
      summary: Get all comments for a post
      description: Returns top-level comments with their direct (depth-1) replies nested inline. No pagination.
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { comments: { type: array, items: { type: object } } } }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/comments/{comment_id}/replies:
    get:
      tags: [Comments]
      summary: Get direct replies to a comment
      description: Only works on top-level (depth-0) comments — a depth-1 comment has no replies by design.
      parameters: [{ name: comment_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      replies: { type: array, items: { $ref: '#/components/schemas/Comment' } }
                      parent_comment: { type: object }
        '400':
          description: Called on a comment that's already at max depth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

