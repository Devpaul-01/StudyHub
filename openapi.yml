                    type: object
                    properties:
                      mutual_connections: { type: array, items: { type: object } }
                      count: { type: integer }
                      other_user: { $ref: '#/components/schemas/UserSummary' }
        '400':
          description: User not found or is yourself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/connections/suggestions:
    get:
      tags: [Connections]
      summary: Grouped study-partner and mentor suggestions
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      study_partners: { type: array, items: { type: object } }
                      mentors: { type: array, items: { type: object } }
                      total: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/connections/search:
    get:
      tags: [Connections]
      summary: Search users (connections-scoped)
      description: Wraps the shared user-search service; excludes users involved in a block relationship with the viewer.
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: OK, capped at 50 results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      users: { type: array, items: { $ref: '#/components/schemas/UserPublic' } }
                      total: { type: integer }
                      search_term: { type: string }
        '400':
          description: Query missing or too short.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/connections/mutuals/discover:
    get:
      tags: [Connections]
      summary: Discover friends-of-friends
      description: Falls back to generic high-quality suggestions if the viewer has no connections or no mutual matches meet the threshold.
      parameters:
        - name: min_mutuals
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: OK, capped at 100 results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      discoveries: { type: array, items: { type: object } }
                      total: { type: integer }
                      discovery_type: { type: string, enum: [mutual, generic] }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/connections/suggestions/flat:
    get:
      tags: [Connections]
      summary: Flat (ungrouped) connection suggestions
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: array, items: { type: object } }
                  total: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/connections/available-now:
    get:
      tags: [Connections]
      summary: Connections available to help right now
      description: Scores connections by online status, subject match, and schedule availability for the current time slot.
      parameters:
        - name: subject
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      subject: { type: string }
                      available_now: { type: array, items: { type: object } }
                      total: { type: integer }

  /student/connections/overview/{user_id}:
    get:
      tags: [Connections]
      summary: AI-generated "why connect" overview (streaming)
      description: |
        Server-Sent Events stream. AI_EXPENSIVE rate tier. Falls back to a template-based
        overview (still 200, `ai_available: false`) if no AI provider is available — see
        ARCHITECTURE.md §11.7. Content-Type is `text/event-stream`; the JSON schema below
        describes the shape of each `data:` event's payload, not the response body as a whole.
      parameters: [{ name: user_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: SSE stream, or a plain JSON fallback body when no AI provider is available.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Sequence of `data: {...}\\n\\n` events with types: start, compatibility, target_user, activity, ai_start, retry, done"
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      target_user: { $ref: '#/components/schemas/UserSummary' }
                      compatibility: { type: object }
                      ai_overview: { type: string }
                      activity: { type: object }
                      already_connected: { type: boolean }
                      ai_available: { type: boolean }
        '400':
          description: Target is yourself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/connections/{connection_id}/details:
    get:
      tags: [Connections]
      summary: Full connection detail (metrics, mutuals, health, study history)
      parameters: [{ name: connection_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      connection: { type: object }
                      partner: { $ref: '#/components/schemas/UserPublic' }
                      mutual_connections: { type: object }
                      shared_threads: { type: object }
                      interaction_metrics: { type: object }
                      health: { type: object }
                      study_history: { type: object }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/connections/online:
    get:
      tags: [Connections]
      summary: List online connections
      parameters:
        - name: time_window
          in: query
          schema: { type: integer, default: 30, maximum: 120 }
          description: Minutes since last_active to count as online.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: array, items: { type: object } }
                  total: { type: integer }
                  time_window_minutes: { type: integer }
                  message: { type: string }

  /student/connections/online/count:
    get:
      tags: [Connections]
      summary: Count of online connections
      parameters:
        - name: time_window
          in: query
          schema: { type: integer, default: 30, maximum: 120 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      time_window_minutes: { type: integer }
                      total_connections: { type: integer }

  /student/connections/online/department:
    get:
      tags: [Connections]
      summary: Online connections in your department
      parameters:
        - name: time_window
          in: query
          schema: { type: integer, default: 30, maximum: 120 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: array, items: { type: object } }
                  total: { type: integer }
                  user_department: { type: string, nullable: true }
                  time_window_minutes: { type: integer }
                  message: { type: string }

  /student/connections/{connection_id}/notes:
    get:
      tags: [Connections]
      summary: Get your notes on a connection
      parameters: [{ name: connection_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      connection_id: { type: integer }
                      notes: { type: string }
                      is_requester: { type: boolean }
                      partner: { $ref: '#/components/schemas/UserSummary' }
                      status: { type: string }
                      last_updated: { type: string, format: date-time }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/connections/{connection_id}/notes/update:
    put:
      tags: [Connections]
      summary: Update your notes on a connection
      parameters: [{ name: connection_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { connection_id: { type: integer }, notes: { type: string }, is_requester: { type: boolean } } }
        '400':
          description: Notes too long.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Connections]
      summary: Update your notes on a connection (alias of PUT)
      parameters: [{ name: connection_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { type: object }
        '400':
          $ref: '#/components/responses/ErrorGeneric'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/messages/resources/upload:
    post:
      tags: [Messages]
      summary: Upload a message attachment
      description: 50MB max. Images/documents get content-validated (SECURITY.md §5); other types are trusted by extension.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      url: { type: string }
                      type: { type: string, enum: [image, video, audio, document, file] }
                      filename: { type: string }
                      size: { type: integer }
                      cloudinary_public_id: { type: string }
        '400':
          description: No file, empty filename, too large, or failed content validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/messages/shared-media/{partner_id}:
    get:
      tags: [Messages]
      summary: List shared media with a partner
      parameters:
        - { name: partner_id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [images, videos, documents, links, all], default: all } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      partner: { $ref: '#/components/schemas/UserSummary' }
                      media: { type: array, items: { type: object } }
                      counts: { type: object }
                      pagination: { $ref: '#/components/schemas/Pagination' }
                      filter: { type: object }
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/messages/shared-media/{partner_id}/count:
    get:
      tags: [Messages]
      summary: Shared-media counts by type
      parameters: [{ name: partner_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { counts: { type: object } } }
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/messages/{message_id}/delete-for-everyone:
    delete:
      tags: [Messages]
      summary: Delete a message for everyone
      description: Sender-only, within 5 minutes of sending. Body text replaced with "[Message deleted]".
      parameters: [{ name: message_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Not found, not sender, or 5-minute window expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/messages/{message_id}/delete-for-me:
    delete:
      tags: [Messages]
      summary: Delete a message for yourself only
      parameters: [{ name: message_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Not found, or not sender/receiver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/messages/clear/{partner_id}:
    delete:
      tags: [Messages]
      summary: Clear (soft-delete) your view of a whole conversation
      parameters: [{ name: partner_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /student/messages/conversations:
    get:
      tags: [Messages]
      summary: List conversations (one per accepted connection)
      description: Includes connections with zero messages. Sorted by most recent visible message.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      conversations: { type: array, items: { type: object } }
                      total_unread: { type: integer }
                      total_conversations: { type: integer }

  /student/messages/conversation/{partner_id}:
    get:
      tags: [Messages]
      summary: Get messages in a conversation
      description: Marks incoming messages as read as a side effect and pushes a `messages_read` WebSocket event if the sender is online.
      parameters:
        - { name: partner_id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/PageParam'
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: "Only return messages after this ISO timestamp (used for polling)." }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      messages: { type: array, items: { type: object } }
                      is_blocked_by_me: { type: boolean }
                      blocked_by_partner: { type: boolean }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '403':
          description: Not connected and not in a blocked relationship (so no history to view either way).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/messages/{message_id}/mark-read:
    post:
      tags: [Messages]
      summary: Mark a single message as read
      parameters: [{ name: message_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          description: Not the receiver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/messages/mark-all-read/{partner_id}:
    post:
      tags: [Messages]
      summary: Mark all messages from a partner as read
      parameters: [{ name: partner_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /student/messages/unread-count:
    get:
      tags: [Messages]
      summary: Total unread message count
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { unread_count: { type: integer } } }

  /student/messages/search:
    get:
      tags: [Messages]
      summary: Search your messages
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: partner_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK, capped at 50 results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      results: { type: array, items: { type: object } }
                      count: { type: integer }
        '400':
          description: Missing query.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/messages/can-message/{user_id}:
    get:
      tags: [Messages]
      summary: Check whether you can message a user
      parameters: [{ name: user_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      can_message: { type: boolean }
                      reason: { type: string }
                      can_connect: { type: boolean }

  /student/messages/block/{user_id}:
    post:
      tags: [Messages]
      summary: Block a user (from the messaging surface)
      description: Equivalent to `/student/connections/block/<user_id>` — same underlying block.
      parameters: [{ name: user_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Cannot block yourself, or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/messages/unblock/{user_id}:
    post:
      tags: [Messages]
      summary: Unblock a user (from the messaging surface)
      description: Restores connection status to `accepted` rather than deleting the row.
      parameters: [{ name: user_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Unblocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/messages/report/{message_id}:
    post:
      tags: [Messages]
      summary: Report a message
      description: Currently only logs the report server-side — no `MessageReport` model exists.
      parameters: [{ name: message_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          description: Can only report messages sent to you.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400':
          description: Reason required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/create:
    post:
      tags: [Threads]
      summary: Create a thread from a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                post_id: { type: integer, description: "Optional — post must have thread_enabled" }
                title: { type: string, minLength: 5 }
                description: { type: string }
                tags: { type: array, items: { type: string } }
                max_members: { type: integer, default: 10, minimum: 2, maximum: 50 }
                requires_approval: { type: boolean, default: true }
                resource: { type: string, description: "Avatar URL" }
                member_ids: { type: array, items: { type: integer }, description: "Directly add these users as members" }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      thread: { $ref: '#/components/schemas/Thread' }
                      added_members: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        '400':
          description: Missing/short title, post not thread-enabled, invalid max_members, or capacity exceeded by member_ids.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/create-standalone:
    post:
      tags: [Threads]
      summary: Create a standalone thread (no post)
      description: Capped at 3 threads created per user per rolling 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 5 }
                description: { type: string }
                max_members: { type: integer, default: 10, minimum: 2, maximum: 50 }
                requires_approval: { type: boolean, default: true }
                tags: { type: array, items: { type: string } }
                member_ids: { type: array, items: { type: integer } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      thread: { $ref: '#/components/schemas/Thread' }
                      added_members: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        '400':
          description: Missing/short title, invalid max_members, or capacity exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: 3-thread weekly cap reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{resource_id}/details:
    post:
      tags: [Threads]
      summary: Legacy thread-details lookup
      description: "Historical POST endpoint kept for existing frontend callers. `resource_id` is a thread ID unless `type: post` is passed in the body, in which case it's a post ID."
      parameters: [{ name: resource_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [post] }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { thread: { type: object } } }
        '400':
          description: Thread not found (returned as a generic error, not 404, for this legacy route).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/close:
    post:
      tags: [Threads]
      summary: Close a thread to new join requests
      description: Creator-only. Existing members can still message.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/reopen:
    post:
      tags: [Threads]
      summary: Reopen a closed thread
      description: Creator-only.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Reopened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}:
    patch:
      tags: [Threads]
      summary: Update thread details
      description: Creator-only. Broadcasts `thread_updated` to members over WebSocket.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 5 }
                description: { type: string }
                max_members: { type: integer, description: "Must be >= current member_count and <= 50" }
                tags: { type: array, items: { type: string }, maxItems: 5 }
      responses:
        '200':
          description: Updated, or "No changes made".
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { changes: { type: array, items: { type: string } } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Threads]
      summary: Delete a thread
      description: Creator-only. Cascades members/messages/requests; notifies members first.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/{thread_id}/avatar:
    post:
      tags: [Threads]
      summary: Upload/replace thread avatar
      description: Creator-only. 5MB max, image content-validated.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { avatar_url: { type: string } } }
        '400':
          description: No file, unsupported type, too large, or failed content validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Storage not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/stats:
    get:
      tags: [Threads]
      summary: Thread statistics
      description: Members-only.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      thread: { type: object }
                      stats: { type: object }
                      members: { type: array, items: { type: object } }
                      most_active: { type: object, nullable: true }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/{thread_id}/settings:
    get:
      tags: [Threads]
      summary: Get thread settings
      description: Creator-only.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      settings:
                        type: object
                        properties:
                          is_open: { type: boolean }
                          max_members: { type: integer }
                          requires_approval: { type: boolean }
                          current_members: { type: integer }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Threads]
      summary: Update thread settings
      description: Creator-only.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requires_approval: { type: boolean }
                max_members: { type: integer }
      responses:
        '200':
          description: Updated, or "No changes made".
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { changes: { type: array, items: { type: string } } } }
        '400':
          description: Invalid max_members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/{thread_id}/leave:
    post:
      tags: [Threads]
      summary: Leave a thread
      description: Creator cannot leave (must transfer ownership or delete the thread).
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Left.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          description: Creator cannot leave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Thread not found, or not a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/remove/{user_id}:
    delete:
      tags: [Threads]
      summary: Remove a member from a thread
      description: Creator or moderator only. Cannot remove the creator.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          description: Not moderator/creator, or target is the creator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Thread not found or target isn't a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/members:
    get:
      tags: [Threads]
      summary: List thread members
      description: Members-only. Includes a 5-minute-activity-derived `online` flag per member.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      members: { type: array, items: { type: object } }
                      total: { type: integer }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/pending-requests:
    get:
      tags: [Threads]
      summary: List pending join requests for threads you created
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { pending_requests: { type: array, items: { type: object } }, total: { type: integer } } }

  /student/threads/my-requests:
    get:
      tags: [Threads]
      summary: List your own pending join requests
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { my_requests: { type: array, items: { type: object } }, total: { type: integer } } }

  /student/threads/{thread_id}/members/{user_id}/role:
    patch:
      tags: [Threads]
      summary: Change a member's role
      description: Creator-only. Roles member/moderator (creator role cannot be changed here).
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, moderator] }
      responses:
        '200':
          description: Updated (or no-op if unchanged).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { user_id: { type: integer }, new_role: { type: string } } }
        '400':
          description: Invalid role value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not creator, or target is the creator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Thread not found, or target isn't a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/requests/{request_id}/cancel:
    delete:
      tags: [Threads]
      summary: Cancel your own pending join request
      parameters: [{ name: request_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Request is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{resource_id}/join:
    post:
      tags: [Threads]
      summary: Request to join a thread
      description: |
        `resource_id` is a thread ID unless `type: post` is passed in the body, in which case
        it resolves the thread spawned from that post. Re-requesting after rejection is
        blocked for 24 hours from the review.
      parameters: [{ name: resource_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [post] }
                message: { type: string }
      responses:
        '201':
          description: Request sent (new or re-sent after a prior rejection).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { request_id: { type: integer } } }
        '403':
          description: Thread is closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Thread not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Already a member, already have a pending request, or already approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rejection cooldown still active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/requests/{request_id}/approve:
    post:
      tags: [Threads]
      summary: Approve a join request
      description: Creator or moderator only. Row-locks the thread before the capacity check.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: request_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { new_member: { $ref: '#/components/schemas/UserSummary' } } }
        '403':
          description: Thread full, or not moderator/creator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Thread or request not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/requests/{request_id}/reject:
    post:
      tags: [Threads]
      summary: Reject a join request
      description: Creator or moderator only.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: request_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Thread or request not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/invite/{user_id}:
    post:
      tags: [Threads]
      summary: Directly invite a user to a thread
      description: Creator or moderator only. Bypasses approval — invited user still has to accept.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { invited_user: { $ref: '#/components/schemas/UserSummary' } } }
        '403':
          description: Thread full, or not moderator/creator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Thread or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Already a member, or already has a pending invite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/invites:
    get:
      tags: [Threads]
      summary: List your pending thread invites
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { invites: { type: array, items: { type: object } }, total: { type: integer } } }

  /student/threads/invites/{invite_id}/accept:
    post:
      tags: [Threads]
      summary: Accept a thread invite
      parameters:
        - { name: invite_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { thread_id: { type: integer }, thread: { $ref: '#/components/schemas/Thread' } } }
        '403':
          description: Invite is not for you.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Invite no longer valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/invites/{invite_id}/decline:
    post:
      tags: [Threads]
      summary: Decline a thread invite
      parameters: [{ name: invite_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          description: Invite is not for you.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Invite no longer valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/members/add:
    post:
      tags: [Threads]
      summary: Directly add accepted connections as members
      description: Creator or moderator only. Up to 10 user IDs; must be accepted connections of the caller. Already-members are silently skipped.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 10 }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      added: { type: array, items: { type: object } }
                      skipped: { type: array, items: { type: integer } }
                      member_count: { type: integer }
        '400':
          description: Empty/oversized list, or no eligible users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Thread closed, or not moderator/creator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/{thread_id}/messages:
    get:
      tags: [Threads]
      summary: Get thread messages (cursor pagination)
      description: Members-only. Marks the page as read for the caller as a side effect (only when it contains something new).
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: before_id, in: query, schema: { type: integer }, description: "Load older messages (id < before_id)" }
        - { name: after_id, in: query, schema: { type: integer }, description: "Load newer messages / poll (id > after_id)" }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 50 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      messages: { type: array, items: { $ref: '#/components/schemas/ThreadMessage' } }
                      has_more: { type: boolean }
                      oldest_id: { type: integer, nullable: true }
                      pinned_messages: { type: array, items: { $ref: '#/components/schemas/ThreadMessage' } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Threads]
      summary: Send a thread message (REST fallback)
      description: |
        Members-only. Broadcasts to WebSocket-connected members. Primary send path is
        Socket.IO's `send_thread_message` event — this REST endpoint exists as a fallback and
        returns a smaller payload than the WebSocket broadcast (just `message_id`/`sent_at`).
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text_content: { type: string, maxLength: 5000 }
                reply_to_id: { type: integer, nullable: true }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      attachment_url: { type: string }
                      attachment_name: { type: string }
                      attachment_type: { type: string }
                      attachment_size: { type: integer }
                attachment_url: { type: string, description: "Legacy single-attachment fallback" }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { message_id: { type: integer }, sent_at: { type: string, format: date-time } } }
        '400':
          description: Empty message with no attachment, or message too long.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a member, or thread closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/{thread_id}/messages/upload:
    post:
      tags: [Threads]
      summary: Upload a thread message attachment
      description: Members-only. 25MB max.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      attachment_url: { type: string }
                      attachment_name: { type: string }
                      attachment_type: { type: string }
                      attachment_size: { type: integer }
        '400':
          description: No file, unsupported type, too large, or failed content validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Storage not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/{thread_id}/messages/search:
    get:
      tags: [Threads]
      summary: Search messages within a thread
      description: Members-only.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      results: { type: array, items: { type: object } }
                      total: { type: integer }
                      query: { type: string }
        '400':
          description: Query too short.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/threads/{thread_id}/messages/pinned:
    get:
      tags: [Threads]
      summary: List pinned messages in a thread
      description: Members-only.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { pinned_messages: { type: array, items: { type: object } } } }
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/threads/{thread_id}/messages/{message_id}:
    patch:
      tags: [Threads]
      summary: Edit a thread message
      description: |
        Sender-only ownership; AI messages can never be edited. 15-minute edit window for
        ordinary members, no window for moderators/creators. Broadcasts `thread_message_edited`.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: message_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text_content]
              properties:
                text_content: { type: string, maxLength: 5000 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { edited_at: { type: string, format: date-time } } }
        '400':
          description: Message belongs to a different thread than the URL, empty text, or text too long.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not your message, AI message, or edit window expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Threads]
      summary: Delete a thread message
      description: Sender, moderator, or creator can delete (soft delete — text replaced with "[deleted]"). Broadcasts `thread_message_deleted`.
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: message_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          description: Not sender, moderator, or creator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/departments:
    get:
      tags: [Threads]
      summary: Thread stats by department
      responses:
        '200':
          description: OK (cached 30 min for the shared part).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      departments: { type: array, items: { type: object } }
                      your_department: { type: string, nullable: true }
                      total_departments: { type: integer }

  /student/threads/popular:
    get:
      tags: [Threads]
      summary: Popular threads from other departments
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
        - { name: min_members, in: query, schema: { type: integer, default: 3 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      threads: { type: array, items: { type: object } }
                      excluded_department: { type: string, nullable: true }
                      total_found: { type: integer }
                      discovery_mode: { type: string, enum: [cross_department] }

  /student/threads/recommended:
    get:
      tags: [Threads]
      summary: Personalized thread recommendations
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 30 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      recommendations: { type: array, items: { type: object } }
                      total_found: { type: integer }
                      personalization: { type: object }

  /student/threads/help/suggestions:
    get:
      tags: [Threads]
      summary: Users you can help based on onboarding subjects
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      suggestions: { type: array, items: { type: object } }
                      your_strengths: { type: array, items: { type: string } }
                      total_found: { type: integer }
                      showing: { type: integer }
        '400':
          description: No onboarding details / no strong subjects set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/threads/my-threads:
    get:
      tags: [Threads]
      summary: List threads you're a member of
      description: Includes an unread count and last-message preview per thread.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { threads: { type: array, items: { type: object } }, total: { type: integer } } }

  /student/threads/open:
    get:
      tags: [Threads]
      summary: List all open threads
      responses:
        '200':
          description: OK, no pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: array, items: { type: object } }

  /student/threads/{thread_id}:
    get:
      tags: [Threads]
      summary: Get a single thread
      description: |
        Members get the full member list; creators/moderators additionally get pending join
        requests. Non-members get basic info plus their own membership/join status.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      thread: { $ref: '#/components/schemas/Thread' }
                      user_status: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/threads/{thread_id}/meeting-notes:
    post:
      tags: [Threads]
      summary: Generate AI meeting notes
      description: |
        Members-only. AI_EXPENSIVE rate tier. Summarizes the last N messages
        (10-500, default 50) into structured topics/decisions/action items/open questions.
        Requires at least 3 messages in the thread.
      parameters: [{ name: thread_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_range: { type: integer, default: 50, minimum: 10, maximum: 500 }
      responses:
        '200':
          description: Generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      notes:
                        type: object
                        properties:
                          topics_discussed: { type: array, items: { type: string } }
                          decisions_made: { type: array, items: { type: string } }
                          action_items: { type: array, items: { type: string } }
                          open_questions: { type: array, items: { type: string } }
                          summary: { type: string }
                      message_count: { type: integer }
                      note_id: { type: integer }
                      generated_at: { type: string, format: date-time }
        '400':
          description: Fewer than 3 messages to summarize.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: AI service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Threads]
      summary: List previously generated meeting notes
      parameters:
        - { name: thread_id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 5, maximum: 20 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { notes: { type: array, items: { type: object } } } }
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/posts/feed:
    get:
      tags: [Posts]
      summary: Get the main feed (cursor pagination)
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, connections, department, trending, unsolved], default: all } }
        - { name: cursor, in: query, schema: { type: string }, description: "Opaque base64 cursor from a previous response's next_cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 20 } }
        - { name: post_type, in: query, schema: { type: string, enum: [question, discussion, announcement, resource, problem] } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      posts: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      filter: { type: string }
                      next_cursor: { type: string, nullable: true }
                      has_more: { type: boolean }
                      debug: { type: object }

  /student/posts/{post_id}/react:
    post:
      tags: [Posts]
      summary: Toggle a like on a post
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Unliked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { liked: { type: boolean, enum: [false] }, count: { type: integer } } }
        '201':
          description: Liked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { liked: { type: boolean, enum: [true] }, count: { type: integer } } }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/posts/resource/upload:
    post:
      tags: [Posts]
      summary: Upload a post resource file
      description: Images/documents get content-validated (SECURITY.md §5).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { $ref: '#/components/schemas/Resource' }
        '400':
          description: No file, invalid file, or failed content validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Storage temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/by-type:
    get:
      tags: [Posts]
      summary: Get posts filtered by type
      parameters:
        - { name: post_type, in: query, required: true, schema: { type: string, enum: [question, discussion, announcement, resource, problem] } }
        - $ref: '#/components/parameters/PageParam'
        - { name: per_page, in: query, schema: { type: integer, default: 20 } }
        - { name: department, in: query, schema: { type: string } }
        - { name: tags, in: query, schema: { type: string }, description: "Comma-separated" }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      posts: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      post_type: { type: string }
                      filters: { type: object }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          description: Missing or invalid post_type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/options-menu:
    get:
      tags: [Posts]
      summary: Get fresh state for a post's options menu
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/posts/by-status:
    get:
      tags: [Posts]
      summary: Get question/problem posts grouped by solved status
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [solved, unsolved, all], default: all } }
        - { name: post_type, in: query, schema: { type: string, enum: [question, problem] } }
        - $ref: '#/components/parameters/PageParam'
        - { name: per_page, in: query, schema: { type: integer, default: 20 } }
        - { name: department, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      posts: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      summary: { type: object }
                      filters: { type: object }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          description: Invalid status value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/view:
    post:
      tags: [Posts]
      summary: Record a post view
      description: Idempotent per user (one view record per user/post pair) — does not re-increment on repeat calls.
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Viewed (or already-viewed no-op).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Post not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/metrics:
    get:
      tags: [Posts]
      summary: Get engagement metrics for a post
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      post_id: { type: integer }
                      total_views: { type: integer }
                      total_reactions: { type: integer }
                      total_comments: { type: integer }
                      total_bookmarks: { type: integer }
                      reaction_breakdown: { type: object }
                      engagement_rate: { type: number }
                      comment_rate_per_hour: { type: number }
                      daily_views: { type: array, items: { type: object } }
                      is_trending: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/posts/{post_id}/report:
    post:
      tags: [Posts]
      summary: Report a post for moderation
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [spam, harassment, inappropriate, misinformation, other] }
                description: { type: string }
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: Invalid reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already reported by this user and still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/create:
    post:
      tags: [Posts]
      summary: Create a post
      description: Rate-limited by an additional in-app spam check (10 posts/hour) beyond the WRITE_HEAVY tier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 5, maxLength: 200 }
                text_content: { type: string }
                post_type: { type: string, enum: [question, discussion, announcement, resource, problem], default: discussion }
                department: { type: string, description: "Defaults to the author's profile department" }
                tags: { type: array, items: { type: string }, maxItems: 5 }
                thread_enabled: { type: boolean, default: false }
                thread_title: { type: string }
                thread_description: { type: string }
                max_members: { type: integer }
                requires_approval: { type: boolean }
                resources:
                  type: array
                  items:
                    oneOf:
                      - { type: string, description: "Bare URL" }
                      - { $ref: '#/components/schemas/Resource' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      post: { type: object }
                      mentioned_users: { type: array, items: { type: integer } }
        '400':
          description: Missing/short/long title, invalid post_type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Spam check triggered (10 posts/hour).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/quick-view:
    get:
      tags: [Posts]
      summary: Minimal post lookup (id/title/content only)
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, properties: { id: { type: integer }, title: { type: string }, content: { type: string, nullable: true } } }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/posts/{post_id}:
    get:
      tags: [Posts]
      summary: Get full post detail
      description: Increments the view counter unconditionally on every call (distinct from the idempotent `/view` endpoint).
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      post: { type: object }
                      stats: { type: object }
                      author: { $ref: '#/components/schemas/UserPublic' }
                      user_interaction: { type: object }
                      permissions: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Posts]
      summary: Delete a post
      description: Author-only. Cascades comments/reactions/bookmarks/threads; also cleans up views/follows/mentions that aren't covered by ORM cascade.
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/posts/{post_id}/edit:
    patch:
      tags: [Posts]
      summary: Edit a post
      description: Author-only. post_type and department cannot be changed here.
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 5 }
                text_content: { type: string }
                tags: { type: array, items: { type: string }, maxItems: 5 }
                thread_enabled: { type: boolean, description: "Only applied if the post has zero threads so far" }
      responses:
        '200':
          description: Updated, or "No changes made".
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { changes: { type: array, items: { type: string } }, edited_at: { type: string, format: date-time } } }
        '400':
          description: Title too short.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/posts/{post_id}/mark-solved:
    post:
      tags: [Posts]
      summary: Mark a question/problem as solved (without picking a solution comment)
      description: Author-only.
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Marked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Post type doesn't support solving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/unmark-solved:
    post:
      tags: [Posts]
      summary: Unmark a post as solved
      description: Author-only. Also clears `is_solution` on any comment that had it.
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Unmarked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Post type doesn't support solving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/follow:
    post:
      tags: [Posts]
      summary: Follow a post for notifications
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '201':
          description: Following.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already following.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/posts/{post_id}/unfollow:
    delete:
      tags: [Posts]
      summary: Unfollow a post
      parameters: [{ name: post_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Unfollowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404':
          description: Not following this post.
          content:
