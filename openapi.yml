  /student/connections/request/{user_id}:
    post:
      tags: [Connections]
      summary: Send (or auto-accept) a connection request
      description: |
        Auto-accepts instantly (status `accepted`) if computed compatibility is >= 70%,
        otherwise creates a `pending` request. Re-requesting after a rejection is blocked for
        24 hours from the rejection.
      parameters: [{ name: user_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
      responses:
        '201':
          description: New request created (instant or pending).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      connection_id: { type: integer }
                      is_instant: { type: boolean }
                      connection_status: { type: string }
                      compatibility: { type: object }
                      receiver: { $ref: '#/components/schemas/UserSummary' }
        '200':
          description: Already connected, already pending, or the other side's pending request was auto-accepted.
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Re-request attempted during the 24-hour post-rejection cooldown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Target user has blocked this relationship.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

