      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, completed, all], default: active } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [priority, due_date, created_at], default: priority } }
        - { name: limit, in: query, schema: { type: integer, default: 15, maximum: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
