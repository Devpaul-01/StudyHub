openapi: 3.0.3
info:
  title: StudyHub API
  version: "1.0"
  description: |
    StudyHub is a peer academic collaboration platform. This spec covers the JSON HTTP API
    served by the Flask backend under the `/student` blueprint, the top-level `/admin` blueprint,
    Google OAuth entry points under `/google`, and the three unauthenticated app-level routes
    (`/`, `/health`, `/robots.txt`).

    **Not covered here:**
    - Routes that render HTML templates instead of returning JSON (login/register pages, the
      onboarding page, profile page, thread/learnora pages, `/demo`, `/features`). Several of
      these paths are dual-purpose — the same path accepts POST with a JSON body and is documented
      for that method only.
    - Socket.IO WebSocket events (thread messaging, presence, typing indicators, live-session
      timers). These aren't HTTP requests and don't fit the OpenAPI model. See API_REFERENCE.md's
      "WebSocket Events" section and `ARCHITECTURE.md` for how real-time delivery works.

    **Base URL:** all paths below are relative to the deployed host, e.g. `https://api.example.com`.
    There is no separate `/api/v1`-style prefix — paths are used as-is.

servers:
  - url: /

tags:
  - name: Auth
  - name: Google OAuth
  - name: Onboarding
  - name: Profile
  - name: Connections
  - name: Messages
  - name: Threads
  - name: Posts
  - name: Comments
  - name: Bookmarks
  - name: Homework
  - name: Study Sessions
  - name: Study Buddy
  - name: Leaderboard
  - name: Reputation
  - name: Badges
  - name: Analytics
  - name: Search
  - name: Notifications
  - name: Learnora (AI)
  - name: Admin
  - name: System

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Primary auth mechanism for browser clients. Set on login/registration/OAuth callback
        as a short-lived (30 minute) JWT. `role_required()` reads this cookie if no
        `Authorization` header is present. A `refresh_token` cookie (7-day, httponly, rotating)
        is used by `POST /student/refresh-token` to mint a new access token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Alternative to the cookie: `Authorization: Bearer <access_token>`. Checked before the
        cookie by `role_required()`. Same JWT, same 30-minute lifetime.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required on mutating requests (POST/PUT/PATCH/DELETE) under `/student/*` when
        `ACCESS_TOKEN_HTTPONLY` is enabled (the default), except for a documented list of
        pre-auth routes (login, register, password reset, etc. — see API_REFERENCE.md).
        Value must match the `csrf_token` cookie issued alongside `access_token`. Enforced by
        `student_bp.before_request`. Missing/mismatched token returns 403.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
      description: Page number (1-indexed).
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 20 }
      description: Results per page. Most endpoints cap this at 50; a few cap lower — see individual endpoints.
    LimitParam:
      name: limit
      in: query
      schema: { type: integer }
      description: Max results to return. Default and cap vary by endpoint.

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }
        data: {}
      required: [status]

    ErrorResponse:
      type: object
      properties:
        status: { type: string, enum: [error] }
        message: { type: string }
        errors:
          type: object
          description: Present only for structured field-level validation errors (from AppError subclasses that pass `details`).
      required: [status, message]

    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        pages: { type: integer }
        has_next: { type: boolean }
        has_prev: { type: boolean }

    CursorPagination:
      type: object
      description: Used by feed/homework-feed style endpoints instead of page-based pagination.
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    UserSummary:
      type: object
      properties:
        id: { type: integer }
        username: { type: string, nullable: true }
        name: { type: string }
        avatar: { type: string, nullable: true }
        reputation_level: { type: string }

    UserPublic:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            bio: { type: string, nullable: true }
            reputation: { type: integer }
            department: { type: string, nullable: true }
            class_level: { type: string, nullable: true }
            is_online: { type: boolean }
            last_active: { type: string, nullable: true, description: "Formatted string like '5m'/'2h'/'3d', or null while online" }

    Post:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        excerpt: { type: string, nullable: true, description: "Full or truncated text_content depending on endpoint" }
        post_type: { type: string, enum: [question, discussion, announcement, resource, problem] }
        department: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        thread_enabled: { type: boolean }
        is_solved: { type: boolean, nullable: true }
        is_pinned: { type: boolean, nullable: true }
        reactions_count: { type: integer }
        comments_count: { type: integer }
        views_count: { type: integer }
        posted_at: { type: string, format: date-time }
        is_author: { type: boolean }
        author: { $ref: '#/components/schemas/UserSummary' }

    Resource:
      type: object
      properties:
        url: { type: string }
        type: { type: string, description: "e.g. image, document, video" }
        filename: { type: string }

    Comment:
      type: object
      properties:
        id: { type: integer }
        text_content: { type: string }
        post_id: { type: integer }
        likes_count: { type: integer }
        replies_count: { type: integer }
        helpful_count: { type: integer }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        is_solution: { type: boolean }
        depth_level: { type: integer, enum: [0, 1] }
        posted_at: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/UserSummary' }

    Connection:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, accepted, rejected, blocked] }
        user: { $ref: '#/components/schemas/UserPublic' }
        connected_at: { type: string, format: date-time, nullable: true }
        health_score: { type: integer }
        suggestion: { type: string }
        shared_threads: { type: integer }

    Thread:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        department: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        is_open: { type: boolean }
        member_count: { type: integer }
        max_members: { type: integer }
        requires_approval: { type: boolean }
        created_at: { type: string, format: date-time }
        last_activity: { type: string, format: date-time }
        creator: { $ref: '#/components/schemas/UserSummary' }

    ThreadMessage:
      type: object
      properties:
        id: { type: integer }
        thread_id: { type: integer }
        text_content: { type: string }
        sender_id: { type: integer }
        sender: { $ref: '#/components/schemas/UserSummary' }
        is_ai_response: { type: boolean }
        is_edited: { type: boolean }
        is_pinned: { type: boolean }
        reply_to_id: { type: integer, nullable: true }
        attachments:
          type: array
          items:
            type: object
            properties:
              attachment_url: { type: string }
              attachment_name: { type: string, nullable: true }
              attachment_type: { type: string, nullable: true }
              attachment_size: { type: integer, nullable: true }
        reactions:
          type: object
          description: "Map of emoji -> { emoji, count, users: [user_id] }"
        status: { type: string, enum: [sent, delivered, read] }
        sent_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }

    Notification:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        type: { type: string }
        related_type: { type: string, nullable: true }
        related_id: { type: integer, nullable: true }
        link: { type: string, nullable: true }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    Assignment:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        subject: { type: string, nullable: true }
        description: { type: string, nullable: true }
        due_date: { type: string, format: date-time }
        difficulty: { type: string, enum: [easy, medium, hard] }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        status: { type: string, enum: [not_started, in_progress, completed] }
        priority_score: { type: number }
        estimated_hours: { type: number, nullable: true }
        time_spent_minutes: { type: integer }
        hours_until_due: { type: number }
        is_overdue: { type: boolean }
        urgency_level: { type: string, enum: [overdue, urgent, soon, this_week, upcoming] }
        is_shared: { type: boolean }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    ReputationLevel:
      type: object
      properties:
        name: { type: string, enum: [Newbie, Learner, Contributor, Expert, Master] }
        icon: { type: string }
        color: { type: string }
        min: { type: integer }
        max: { type: integer }

    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        rank_change: { type: integer, nullable: true }
        connection_status: { type: string, nullable: true }
        is_you: { type: boolean }
        user: { $ref: '#/components/schemas/UserSummary' }
        score: { type: integer }
        reputation:
          type: object
          properties:
            total: { type: integer }
            level: { $ref: '#/components/schemas/ReputationLevel' }

    Badge:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        category: { type: string }
        rarity: { type: string, enum: [common, rare, epic, legendary] }
        awarded_count: { type: integer }
        has_earned: { type: boolean }
        earned_at: { type: string, format: date-time, nullable: true }

    AIConversationSummary:
      type: object
      properties:
        conversation_id: { type: integer }
        title: { type: string }
        total_messages: { type: integer }
        tokens_used: { type: integer }
        is_last_message_complete: { type: boolean }
        last_message_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  responses:
    ErrorGeneric:
      description: Request failed validation or a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing/invalid/expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated but not allowed to perform this action (role or ownership check failed).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limit exceeded for this route's tier.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  details:
                    type: object
                    properties:
                      limit: { type: string, nullable: true }

paths:
  /:
    get:
      tags: [System]
      summary: Landing page
      description: Renders the marketing landing page (HTML, not JSON). Documented here only because it's the root path.
      security: []
      responses:
        '200':
          description: HTML landing page.
          content:
            text/html: {}

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Checks DB connectivity and reports scheduler status. Used for uptime monitoring. Not rate-limited.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy] }
                  database: { type: string, enum: [connected] }
                  email_configured: { type: boolean }
                  mail_server: { type: string, nullable: true }
                  scheduler:
                    type: object
                    properties:
                      running: { type: boolean }
                      jobs:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            next_run_time: { type: string, format: date-time, nullable: true }
        '500':
          description: Unhealthy — DB check failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unhealthy] }
                  database: { type: string, enum: [disconnected] }

  /robots.txt:
    get:
      tags: [System]
      summary: robots.txt
      security: []
      responses:
        '200':
          description: Plain-text robots directives.
          content:
            text/plain: {}

  /google/start:
    get:
      tags: [Google OAuth]
      summary: Begin Google OAuth flow
      description: Redirects to Google's consent screen. Not an AJAX endpoint — meant for full-page navigation.
      security: []
      responses:
        '302':
          description: Redirect to Google.

  /google/callback:
    get:
      tags: [Google OAuth]
      summary: Google OAuth callback
      description: |
        Handles the OAuth redirect from Google. Resolves the account by Google's stable `sub`
        claim, not email alone (see SECURITY.md §1.2). Redirects to one of: the app homepage
        (existing approved user, cookies set), `/student/onboard/<email>` (needs onboarding),
        `/student/complete-registration?email=<email>` (needs username/password), or back to
        the login page with `?error=...` on failure. Never returns JSON.
      security: []
      responses:
        '302':
          description: Redirect based on account state.

  /student/google_temp_info:
    get:
      tags: [Google OAuth]
      summary: Read pending OAuth session info
      description: Returns the email/name captured in the server-side session during an in-progress Google signup, before a JWT exists.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  email: { type: string, nullable: true }
                  name: { type: string, nullable: true }

  /student/clear-session:
    post:
      tags: [Google OAuth]
      summary: Clear pending OAuth session state
      description: Clears `google_email`/`google_name`/`google_id` from the server-side session. CSRF-exempt (no auth cookie exists yet at this point in the flow).
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /student/users/me:
    get:
      tags: [Auth]
      summary: Get current user (alternate shape)
      description: |
        Same purpose as `/student/auth/me` but returns a much larger user object. Route is
        registered as `users/me` (no leading slash) in the source, which Flask resolves relative
        to the blueprint — confirmed reachable at `/student/users/me`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string, nullable: true }
                          email: { type: string }
                          name: { type: string }
                          avatar: { type: string, nullable: true }
                          bio: { type: string, nullable: true }
                          reputation: { type: integer }
                          reputation_level: { type: string }
                          role: { type: string }
                          status: { type: string }
                          email_verified: { type: boolean }
                          joined_at: { type: string, format: date-time, nullable: true }
                          last_active: { type: string, format: date-time, nullable: true }
                          login_streak: { type: integer }
                          total_posts: { type: integer }
                          total_helpful: { type: integer }
                          in_study_session: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/auth/me:
    get:
      tags: [Auth]
      summary: Get current user (minimal)
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          username: { type: string, nullable: true }
                          avatar: { type: string, nullable: true }

  /student/onboard/suggestions-by-email/{email}:
    get:
      tags: [Onboarding]
      summary: Get onboarding-time match suggestions by email
      description: Pre-auth endpoint (no token) used during onboarding, before the user has a session. Rate-limited SENSITIVE_AUTH tier (5/min, per IP).
      security: []
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: OK — matches, or a fallback top-reputation list if none score highly enough.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            user: { $ref: '#/components/schemas/UserSummary' }
                            match_score: { type: integer }
                            reasons: { type: array, items: { type: string } }
        '400':
          $ref: '#/components/responses/ErrorGeneric'

  /student/onboard/request-all/{email}:
    post:
      tags: [Onboarding]
      summary: Send connection requests to multiple users during onboarding
      description: |
        Pre-auth (no JWT yet). Authorized instead by matching `email` against the caller's
        Google OAuth session or an existing `access_token` cookie for that email
        (`_is_request_authorized_for_email`). SENSITIVE_AUTH rate tier, per IP.
      security: []
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: User IDs to send pending connection requests to. Existing connections (either direction) are silently skipped.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: Caller does not own this email (no matching OAuth session or JWT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400':
          $ref: '#/components/responses/ErrorGeneric'

  /student/onboard/{email}:
    post:
      tags: [Onboarding]
      summary: Save onboarding details
      description: |
        Saves department/class/subjects/schedule/etc, flips the account to
        `pending_verification`, and issues fresh access+refresh token cookies. Pre-auth —
        authorized the same way as `request-all` above (Google session or existing JWT matching
        `email`). SENSITIVE_AUTH rate tier on POST.
      security: []
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                department: { type: string }
                class_level: { type: string }
                subjects: { type: array, items: { type: string } }
                learning_style: { type: string }
                study_preferences: { type: array, items: { type: string } }
                help_subjects: { type: array, items: { type: string } }
                strong_subjects: { type: array, items: { type: string } }
                study_schedule:
                  type: object
                  description: "Map of day name -> array of {morning|afternoon|evening|night}"
                session_length: { type: string }
      responses:
        '200':
          description: Saved. Sets access_token/refresh_token (and csrf_token, if enabled) cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          username: { type: string, nullable: true }
                          email: { type: string }
                      redirect: { type: string }
        '401':
          description: Caller does not own this email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400':
          $ref: '#/components/responses/ErrorGeneric'

  /student/onboard/suggestions/{token}:
    get:
      tags: [Onboarding]
      summary: Get onboarding match suggestions by signed token
      description: Same as the by-email variant, but resolves the user from a JWT (`verify_token`) instead of a raw email in the path.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            user: { $ref: '#/components/schemas/UserSummary' }
                            match_score: { type: integer }
                            reasons: { type: array, items: { type: string } }
        '400':
          description: Token invalid/expired, or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        Creates a `pending_verification` account and emails a single-use verification link,
        unless `google_verified` is true and matches the server-side OAuth session for this
        email — in which case the account is created with `email_verified=true` and the caller
        is sent straight to onboarding. SENSITIVE_AUTH rate tier, per IP. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                google_verified:
                  type: boolean
                  description: Only honored if it also matches session["google_email"] server-side; a bare client claim is not trusted.
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      google_verified: { type: boolean }
                      redirect_url: { type: string }
        '400':
          description: Missing fields, invalid email, or email already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/login:
    post:
      tags: [Auth]
      summary: Log in with username/email + password
      description: SENSITIVE_AUTH rate tier, per IP. CSRF-exempt. Sets access_token/refresh_token cookies on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username_or_email, password]
              properties:
                username_or_email: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          username: { type: string, nullable: true }
                          email: { type: string }
                      redirect: { type: string }
                      login_streak: { type: integer }
        '400':
          description: Invalid credentials, unverified email, incomplete registration, or pending approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/validate-user:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: Looks up by email or username, issues a single-use `PasswordResetToken`, emails a reset link. SENSITIVE_AUTH tier. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "Email or username" }
      responses:
        '200':
          description: Reset link sent (or user not found — see error case).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: User not found or no value provided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/verify-reset/{token}:
    post:
      tags: [Auth]
      summary: Check whether a password-reset token is still valid
      description: Read-only peek — does not consume the single-use token (see SECURITY.md §1.4). SENSITIVE_AUTH tier. CSRF-exempt.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      email: { type: string }
                      token: { type: string }
                      redirect_url: { type: string }
        '400':
          description: Token invalid/expired/already used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/set-password:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      description: Consumes the single-use `PasswordResetToken`. SENSITIVE_AUTH tier. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirm_password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 6 }
                confirm_password: { type: string, format: password }
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      redirect_url: { type: string }
        '400':
          description: Token invalid/expired/used, passwords mismatch, or password too short.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/verify-email/{token}:
    post:
      tags: [Auth]
      summary: Verify email address
      description: |
        Consumes a single-use `EmailVerificationToken`. On success, auto-logs the user in
        (sets access/refresh cookies) and redirects them into onboarding. Replaying an
        already-used token for an already-verified account returns a friendly
        "already verified" success response rather than an error. SENSITIVE_AUTH tier. CSRF-exempt.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verified (or already verified).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      email: { type: string }
                      already_verified: { type: boolean }
                      redirect_url: { type: string }
        '400':
          description: Token invalid/expired and account isn't already verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/check-username:
    post:
      tags: [Auth]
      summary: Check username availability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, pattern: '^[a-z0-9]{3,20}$' }
      responses:
        '200':
          description: Available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { available: { type: boolean } } }
        '400':
          description: Missing/invalid format, or already taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/complete-registration:
    post:
      tags: [Auth]
      summary: Finish registration (set username + password)
      description: |
        Final step after onboarding. Requires either a `token` (from the verification email,
        proves ownership by itself) or the same email-ownership check used elsewhere
        (`_is_request_authorized_for_email`). SENSITIVE_AUTH tier. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm_password, username]
              properties:
                token: { type: string, description: "Optional — JWT proving email ownership" }
                email: { type: string, format: email, description: "Required if token is not supplied" }
                password: { type: string, format: password, minLength: 6 }
                confirm_password: { type: string, format: password }
                username: { type: string, pattern: '^[a-z0-9]{3,20}$' }
      responses:
        '200':
          description: Registration complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { username: { type: string } } }
        '401':
          description: Caller does not own this email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400':
          description: Missing fields, password mismatch/too short, invalid username, username taken, or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/refresh-token:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and mint a new access token
      description: |
        Reads `refresh_token` cookie, validates + rotates it (see SECURITY.md §1.3 for reuse
        detection and the 10-second multi-tab grace window). On success sets a new
        `access_token` cookie and usually a new `refresh_token` cookie (omitted only in the
        grace-window race case). SENSITIVE_AUTH tier. CSRF-exempt.
      security: []
      responses:
        '200':
          description: Refreshed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string, nullable: true }
                          email: { type: string }
                          name: { type: string }
        '400':
          description: |
            No refresh token cookie present, token invalid/expired, reuse detected (entire
            token family revoked), or account not approved. Auth cookies are cleared on
            the invalid/reuse case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/verify-auth:
    get:
      tags: [Auth]
      summary: Check whether the current access token is valid
      description: BURST_OK rate tier, per IP. Does not require a valid token to call — returns 401 with details instead of erroring.
      security: []
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  authenticated: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string, nullable: true }
                          email: { type: string }
                          name: { type: string }
                          avatar: { type: string, nullable: true }
                          role: { type: string }
        '401':
          description: No token, expired token, invalid token, or user no longer exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  authenticated: { type: boolean, enum: [false] }
                  message: { type: string }
                  should_refresh: { type: boolean, description: "Present and true when the access token is expired but may be refreshable" }

  /student/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: |
        Disconnects any live WebSocket session, revokes the entire refresh-token family, and
        clears all three auth cookies. Each step is best-effort — a failure in one never blocks
        the others. BURST_OK rate tier, per IP.
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /admin/health:
    get:
      tags: [Admin]
      summary: Admin health/diagnostics
      description: Requires role admin or system. ADMIN rate tier.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      database: { type: object, properties: { connected: { type: boolean }, error: { type: string } } }
                      redis: { type: object, properties: { connected: { type: boolean }, latency_ms: { type: number }, error: { type: string } } }
                      email_configured: { type: boolean }
                      rate_limiter_storage: { type: string, enum: [redis, memory] }
                      environment: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/scheduler:
    get:
      tags: [Admin]
      summary: Scheduler status
      description: Requires role admin or system. ADMIN rate tier.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      running: { type: boolean }
                      jobs:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            next_run_time: { type: string, format: date-time, nullable: true }
                            trigger: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/ai-providers:
    get:
      tags: [Admin]
      summary: AI provider health/stats
      description: Requires role admin or system. ADMIN rate tier. Returns per-provider cooldown/blacklist state from `MultiProviderManager.get_stats()`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      total_providers: { type: integer }
                      active_providers: { type: integer }
                      failed_keys: { type: array, items: { type: string } }
                      blacklisted_provider_types: { type: object }
                      current_provider: { type: string, nullable: true }
                      providers: { type: array, items: { type: object } }
                      state_source: { type: string, enum: [redis, in-memory] }
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/reconciliation/run:
    post:
      tags: [Admin]
      summary: Manually trigger denormalized-counter reconciliation
      description: Requires role admin or system. ADMIN rate tier. Runs the same job the weekly scheduler runs, on demand.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      counters_checked: { type: integer }
                      drifts_found: { type: integer }
                      corrected_count: { type: integer }
                      alerted_only_count: { type: integer }
                      checked_at: { type: string, format: date-time }
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/profile/me/data:
    get:
      tags: [Profile]
      summary: Get own profile summary
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      username: { type: string, nullable: true }
                      bio: { type: string, nullable: true }
                      avatar: { type: string, nullable: true }
                      department: { type: string, nullable: true }
                      class_level: { type: string, nullable: true }
                      reputation: { type: integer }
                      reputation_level: { type: string }
                      login_streak: { type: integer }
                      joined_at: { type: string, format: date-time }
                      last_active: { type: string, format: date-time, nullable: true }
                      stats:
                        type: object
                        properties:
                          total_posts: { type: integer }
                          total_helpful: { type: integer }
                          total_helps_given: { type: integer }
                          connections_count: { type: integer }
                      learning_goals: { type: array, items: { type: string } }
                      help_streak: { type: object, properties: { current: { type: integer }, longest: { type: integer } } }
                      onboarding:
                        type: object
                        nullable: true
                        properties:
                          subjects: { type: array, items: { type: string } }
                          strong_subjects: { type: array, items: { type: string } }
                          help_subjects: { type: array, items: { type: string } }
                          learning_style: { type: string, nullable: true }
                          study_preferences: { type: array, items: { type: string } }
                          class_level: { type: string, nullable: true }

  /student/profile/my-posts:
    get:
      tags: [Profile]
      summary: List current user's own posts
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [all, pinned, questions, resources, discussions], default: all }
      responses:
        '200':
          description: OK. Capped at 30 posts, no pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      posts: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      total: { type: integer }
                      filter: { type: string }

  /student/profile/my-stats:
    get:
      tags: [Profile]
      summary: Get detailed stats for the Stats tab
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data: { type: object, description: "posts/engagement/threads/help/connections/reputation breakdown" }

  /student/profile/academic-info:
    get:
      tags: [Profile]
      summary: Get academic/onboarding info
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      department: { type: string, nullable: true }
                      class_level: { type: string, nullable: true }
                      subjects: { type: array, items: { type: string } }
                      strong_subjects: { type: array, items: { type: string } }
                      help_subjects: { type: array, items: { type: string } }
                      learning_style: { type: string, nullable: true }
                      study_preferences: { type: array, items: { type: string } }
    put:
      tags: [Profile]
      summary: Update academic/onboarding info
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subjects: { type: array, items: { type: string }, maxItems: 15 }
                strong_subjects: { type: array, items: { type: string }, maxItems: 10 }
                help_subjects: { type: array, items: { type: string }, maxItems: 10 }
                learning_style: { type: string, maxLength: 300 }
                study_preferences: { type: array, items: { type: string }, maxItems: 10 }
      responses:
        '200':
          description: Updated (or no-op response if the onboarding row doesn't exist).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { changes: { type: array, items: { type: string } } } }
        '400':
          $ref: '#/components/responses/ErrorGeneric'

  /student/profile/avatar/upload:
    post:
      tags: [Profile]
      summary: Upload profile avatar
      description: Image is re-encoded from decoded pixel data before upload (see SECURITY.md §5). Allowed extensions jpg/jpeg/png/gif/webp.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { avatar_url: { type: string } } }
        '400':
          description: No file, invalid file, unsupported type, or image failed content validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/profile/avatar:
    delete:
      tags: [Profile]
      summary: Remove profile avatar
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /student/profile/help/suggestions:
    get:
      tags: [Profile]
      summary: Users who can help you (based on your help_subjects)
      responses:
        '200':
          description: OK, top 10.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      your_help_subjects: { type: array, items: { type: string } }
                      suggestions:
                        type: array
                        items:
                          type: object
                          properties:
                            user: { $ref: '#/components/schemas/UserSummary' }
                            profile: { type: object, properties: { department: { type: string, nullable: true }, class_level: { type: string, nullable: true } } }
                            match_details:
                              type: object
                              properties:
                                can_help_with: { type: array, items: { type: string } }
                                overlap_count: { type: integer }
                                match_score: { type: number }
                      total: { type: integer }
        '400':
          description: Onboarding details not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/profile/can-help/suggestions:
    get:
      tags: [Profile]
      summary: Users you can help (based on your strong_subjects)
      responses:
        '200':
          description: OK, top 10.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      your_strong_subjects: { type: array, items: { type: string } }
                      suggestions:
                        type: array
                        items:
                          type: object
                          properties:
                            user: { $ref: '#/components/schemas/UserSummary' }
                            profile: { type: object }
                            match_details:
                              type: object
                              properties:
                                needs_help_with: { type: array, items: { type: string } }
                                overlap_count: { type: integer }
                                match_score: { type: number }
                      total: { type: integer }
        '400':
          description: Onboarding details not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/profile/me:
    post:
      tags: [Profile]
      summary: Get own full profile (stats, badges, activity)
      description: |
        Despite the GET verb being used for the HTML page at this same path, the JSON API for
        "my full profile" is a POST with no body — this mirrors the route's actual
        `methods=["GET", "POST"]` definition where POST returns JSON and GET renders a template.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      user: { type: object }
                      stats: { type: object }
                      badges: { type: array, items: { $ref: '#/components/schemas/Badge' } }
                      active_threads: { type: array, items: { type: object } }
                      activity_heatmap: { type: array, items: { type: object } }
                      skills: { type: array, items: { type: string } }
                      learning_goals: { type: array, items: { type: string } }
                      is_own_profile: { type: boolean, enum: [true] }
                      can_message: { type: boolean, enum: [false] }
        '404':
          $ref: '#/components/responses/NotFound'

  /student/profile/visibility-settings:
    get:
      tags: [Profile]
      summary: Get privacy/visibility settings
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: object
                    properties:
                      set_profile_private: { type: boolean }
                      show_active_status: { type: boolean }
                      set_dark_mode: { type: boolean }
                      send_weekly_notification: { type: boolean }
    post:
      tags: [Profile]
      summary: Update privacy/visibility settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                set_profile_private: { type: boolean, default: false }
                show_active_status: { type: boolean, default: true }
                set_dark_mode: { type: boolean, default: false }
                send_weekly_notification: { type: boolean, default: true }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /student/profile/{username}:
    get:
      tags: [Profile]
      summary: View another user's profile
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: |
            OK. Shape depends on privacy: `data.type` is `"private"` (minimal fields —
            id/username/name/avatar/department/class_level/pinned_posts) or `"public"`
            (full stats/badges/posts/threads/activity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      type: { type: string, enum: [private, public] }
                      user: { type: object }
                      stats: { type: object }
                      connection_status: { type: string, enum: [self, none, pending_sent, pending_received, connected, blocked] }
                      is_own_profile: { type: boolean }
        '400':
          description: User or profile not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/profile/update:
    patch:
      tags: [Profile]
      summary: Update profile (name, bio, department, class)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3 }
                bio: { type: string, maxLength: 500 }
                department: { type: string }
                class_level: { type: string }
      responses:
        '200':
          description: Updated, or "No changes made" if nothing differed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      changes: { type: array, items: { type: string } }
                      user: { type: object }
        '400':
          description: Name too short or bio too long.
          content:
            application/json:
