                      has_more: { type: boolean }
                      suggestions: { type: array, items: { type: object } }
                      stats: { type: object }
    post:
      tags: [Homework]
      summary: Create a personal assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, due_date]
              properties:
                title: { type: string }
                subject: { type: string }
                description: { type: string }
                due_date: { type: string, format: date-time, description: "Must be in the future" }
                difficulty: { type: string, enum: [easy, medium, hard], default: medium }
                estimated_hours: { type: number }
                share_for_help: { type: boolean, default: false }
                resources:
                  type: array
                  items:
                    type: object
                    required: [url, type]
                    properties:
                      url: { type: string }
                      type: { type: string }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                      priority_score: { type: number }
                      is_shared: { type: boolean }
        '400':
          description: Missing title/due_date, invalid date format, due date in the past, or malformed resources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /student/assignments/{assignment_id}:
    put:
      tags: [Homework]
      summary: Update an assignment
      description: Owner-only.
      parameters: [{ name: assignment_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                subject: { type: string }
                description: { type: string }
                due_date: { type: string, format: date-time }
                difficulty: { type: string, enum: [easy, medium, hard] }
                estimated_hours: { type: number }
                resources: { type: array, items: { type: object } }
                status: { type: string, enum: [not_started, in_progress, completed] }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
                  data: { type: object, properties: { id: { type: integer }, status: { type: string }, priority_score: { type: number } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: resources not a list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Homework]
      summary: Delete an assignment
      description: Owner-only. Cascades associated help submissions.
      parameters: [{ name: assignment_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

