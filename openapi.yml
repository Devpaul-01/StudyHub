    post:
      tags: [Learnora (AI)]
      summary: Send a chat message to Learnora
      description: |
        Streams the AI response as Server-Sent Events. AI_EXPENSIVE rate tier. Creates a new
        conversation automatically if `conversation_id` is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                conversation_id: { type: integer, nullable: true }
                attachments: { type: array, items: { type: object } }
      responses:
        '200':
          description: SSE stream of response chunks.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Sequence of `data: {...}\\n\\n` events carrying incremental text and a final `done` event with conversation_id/message_id/tokens_used."
        '400':
          description: Empty message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: AI service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

