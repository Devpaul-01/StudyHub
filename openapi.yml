      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      assignment: { type: object }
                      helpers: { type: array, items: { type: object } }
                      total_helpers: { type: integer }
        '403':
          description: Not your assignment, or not shared.
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean, enum: [false] }, error: { type: string } } }
