<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - StudyHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/set_password.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Password Toggle ── */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input[type="password"],
        .password-wrapper input[type="text"] {
            width: 100%;
            padding-right: 44px;
        }
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--text-meta, #71717A);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }
        .toggle-btn:hover {
            color: var(--text-primary, #FAFAFA);
        }
        .toggle-btn:focus-visible {
            outline: 2px solid var(--accent, #6366F1);
            outline-offset: 2px;
        }
        .toggle-btn .hidden {
            display: none;
        }
        .toggle-btn svg {
            display: block;
        }

        /* ── Status Messages ── */
        .hidden { display: none !important; }
        .invalid { color: var(--danger, #EF4444); font-size: 0.875rem; font-weight: 500; }
        .valid { color: var(--success, #10B981); font-size: 0.875rem; font-weight: 500; }

        /* ── Toast Override ── */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.125rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            animation: toastIn 0.3s ease both;
            max-width: 340px;
        }
        .toast.success { background: var(--success, #10B981); }
        .toast.error   { background: var(--danger, #EF4444); }
        .toast.info    { background: var(--accent, #6366F1); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">🔐</div>
                <h2 class="auth-title">Set New Password</h2>
                <p class="auth-subtitle">Create a strong password for your account</p>
            </div>

            <form id="resetForm" class="auth-form">
                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label required">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-input" 
                               placeholder="Enter new password" 
                               required 
                               minlength="6"
                               autocomplete="new-password">
                        <button type="button" 
                                class="toggle-btn" 
                                id="password-toggle" 
                                aria-label="Show password" 
                                aria-pressed="false">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span id="passwordError" class="form-error hidden"></span>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label required">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" 
                               id="confirmPassword" 
                               name="confirmPassword" 
                               class="form-input" 
                               placeholder="Confirm your password" 
                               required 
                               autocomplete="new-password">
                        <button type="button" 
                                class="toggle-btn" 
                                id="confirm-toggle" 
                                aria-label="Show password" 
                                aria-pressed="false">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span id="confirmError" class="form-error hidden"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
                    Set Password
                </button>
            </form>

            <div class="auth-footer">
                <a href="/student/login">← Back to login</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/utils.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get("email");
            const token = urlParams.get("token");

            const password = document.getElementById("password");
            const passwordSpan = document.getElementById("passwordError");
            const confirmPassword = document.getElementById("confirmPassword");
            const confirmError = document.getElementById("confirmError");
            const resetForm = document.getElementById("resetForm");
            const submitBtn = document.getElementById("submit-btn");

            // ✅ Validate email and token exist
            if (!email || !token) {
                showToast("Invalid reset link. Please request a new password reset.", "error");
                setTimeout(() => {
                    window.location.href = "/student/reset-password";
                }, 2000);
                return;
            }

            // ── Password Toggle ──
            function setupToggle(inputId, toggleId) {
                const input = document.getElementById(inputId);
                const toggle = document.getElementById(toggleId);
                if (!input || !toggle) return;

                const eyeIcon = toggle.querySelector('.icon-eye');
                const eyeOffIcon = toggle.querySelector('.icon-eye-off');

                toggle.addEventListener('click', () => {
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    eyeIcon.classList.toggle('hidden', isPassword);
                    eyeOffIcon.classList.toggle('hidden', !isPassword);
                    toggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                    toggle.setAttribute('aria-pressed', String(isPassword));
                });
            }

            setupToggle('password', 'password-toggle');
            setupToggle('confirmPassword', 'confirm-toggle');

            resetForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                await validatePassword();
            });

            // ── Set Password ──
            async function setPassword() {
                const data = {
                    email: email,
                    token: token,
                    password: password.value,
                    confirm_password: confirmPassword.value
                };

                setButtonLoading(submitBtn, true, 'Setting password...');

                try {
                    const response = await api.post("/set-password", data);

                    if (response.status === "success") {
                        showToast(response.message, "success");
                        setTimeout(() => {
                            window.location.href = "/student/login";
                        }, 3000);
                    } else {
                        showToast(response.message, "error");
                        setButtonLoading(submitBtn, false);
                    }
                } catch (error) {
                    showToast(error.message || "Failed to set password. Please try again.", "error");
                    setButtonLoading(submitBtn, false);
                }
            }

            // ── Validate Password ──
            async function validatePassword() {
                passwordSpan.classList.remove("invalid", "valid");
                confirmError.classList.remove("invalid", "valid");
                passwordSpan.textContent = "";
                confirmError.textContent = "";

                let hasError = false;
                const passwordValue = password.value;
                const confirmValue = confirmPassword.value;

                if (!passwordValue || passwordValue.length < 6) {
                    passwordSpan.classList.add("invalid");
                    passwordSpan.textContent = "Password must be at least 6 characters";
                    hasError = true;
                } else {
                    passwordSpan.classList.add("valid");
                    passwordSpan.textContent = "✓ Password valid";
                }

                if (!confirmValue || confirmValue !== passwordValue) {
                    confirmError.classList.add("invalid");
                    confirmError.textContent = "Passwords must match";
                    hasError = true;
                } else if (passwordValue.length >= 6) {
                    confirmError.classList.add("valid");
                    confirmError.textContent = "✓ Passwords match";
                }

                if (!hasError) {
                    await setPassword();
                }
            }

            // ── Live Validation ──
            password.addEventListener("input", () => {
                const val = password.value;
                passwordSpan.classList.remove("invalid", "valid");
                if (val.length === 0) {
                    passwordSpan.textContent = "";
                    return;
                }
                if (val.length < 6) {
                    passwordSpan.classList.add("invalid");
                    passwordSpan.textContent = "Password must be at least 6 characters";
                } else {
                    passwordSpan.classList.add("valid");
                    passwordSpan.textContent = "✓ Password valid";
                }
                // Re-check confirm password match
                if (confirmPassword.value.length > 0) {
                    confirmError.classList.remove("invalid", "valid");
                    if (confirmPassword.value !== val) {
                        confirmError.classList.add("invalid");
                        confirmError.textContent = "Passwords must match";
                    } else {
                        confirmError.classList.add("valid");
                        confirmError.textContent = "✓ Passwords match";
                    }
                }
            });

            confirmPassword.addEventListener("input", () => {
                const val = confirmPassword.value;
                confirmError.classList.remove("invalid", "valid");
                if (val.length === 0) {
                    confirmError.textContent = "";
                    return;
                }
                if (val !== password.value) {
                    confirmError.classList.add("invalid");
                    confirmError.textContent = "Passwords must match";
                } else if (password.value.length >= 6) {
                    confirmError.classList.add("valid");
                    confirmError.textContent = "✓ Passwords match";
                } else {
                    confirmError.textContent = "";
                }
            });

            // ── Toast Helper (if not in utils) ──
            function showToast(message, type = "info") {
                const container = document.getElementById("toast-container");
                const toast = document.createElement("div");
                toast.className = `toast ${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 4000);
            }

            function setButtonLoading(button, loading, text = "") {
                if (loading) {
                    button.disabled = true;
                    button.dataset.originalText = button.textContent;
                    button.textContent = text || "Loading...";
                } else {
                    button.disabled = false;
                    button.textContent = button.dataset.originalText || "Set Password";
                }
            }
        });
    </script>
</body>
</html>
