<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — StudyHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/auth.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Password toggle button */
        .password-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-field-wrapper .form-input {
            width: 100%;
            padding-right: 44px;
        }
        .password-toggle-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            background: transparent;
            border: none;
            cursor: pointer;
            color: rgba(243,245,251,0.4);
            border-radius: 6px;
            transition: color 0.15s;
        }
        .auth-remember-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
}

.forgot-password-link {
    font-size: 0.875rem;
    color: rgba(243, 245, 251, 0.6);
    text-decoration: none;
    transition: color 0.15s;
}

.forgot-password-link:hover {
    color: #6366f1;
    text-decoration: underline;
}
        .password-toggle-btn:hover { color: rgba(243,245,251,0.75); }
        .password-toggle-btn:focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }
        .password-toggle-btn svg { display: block; }
        .password-toggle-btn .hidden { display: none; }

        /* Demo credentials banner */
        .demo-banner {
            position: relative;
            margin-bottom: 1.5rem;
            padding: 14px 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(139,92,246,0.10));
            border: 1px solid rgba(139,92,246,0.35);
            font-family: 'DM Sans', sans-serif;
        }
        .demo-banner-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .demo-banner-head svg {
            flex-shrink: 0;
            color: #a78bfa;
        }
        .demo-banner-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #e9e6fb;
        }
        .demo-cred-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 8px;
            background: rgba(15, 12, 41, 0.45);
            margin-bottom: 6px;
        }
        .demo-cred-row:last-of-type { margin-bottom: 10px; }
        .demo-cred-label {
            font-size: 0.72rem;
            color: rgba(243,245,251,0.5);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            min-width: 56px;
        }
        .demo-cred-value {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #f3f5fb;
            flex: 1;
            text-align: left;
            padding-left: 4px;
            letter-spacing: 0.02em;
        }
        .demo-copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: rgba(243,245,251,0.45);
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
        }
        .demo-copy-btn:hover {
            color: #a78bfa;
            background: rgba(139,92,246,0.15);
        }
        .demo-copy-btn svg { display: block; pointer-events: none; }
        .demo-autofill-btn {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid rgba(139,92,246,0.4);
            background: rgba(99,102,241,0.12);
            color: #c4b5fd;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .demo-autofill-btn:hover {
            background: rgba(99,102,241,0.22);
            border-color: rgba(139,92,246,0.6);
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">

            <!-- Logo -->
            <div class="auth-logo-row">
                <a href="/" class="auth-wordmark">StudyHub</a>
                <div class="auth-wordmark-dot"></div>
            </div>

            <!-- Live badge -->
            <div class="auth-live-badge">
                <span class="auth-live-dot"></span>
                Students online now
            </div>

            <!-- Heading -->
            <div class="auth-header">
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Pick up where you left off — your people are waiting.</p>
            </div>

            <!-- Demo credentials -->
            <div class="demo-banner">
                <div class="demo-banner-head">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span class="demo-banner-title">Recruiter / reviewer? Skip signup — use the demo account</span>
                </div>
                <div class="demo-cred-row">
                    <span class="demo-cred-label">User</span>
                    <span class="demo-cred-value" id="demo-username">demo_reviewer</span>
                    <button type="button" class="demo-copy-btn" data-copy-target="demo-username" aria-label="Copy username">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <div class="demo-cred-row">
                    <span class="demo-cred-label">Pass</span>
                    <span class="demo-cred-value" id="demo-password">••••••••••••</span>
                    <button type="button" class="demo-copy-btn" data-copy-target="demo-password" data-real-value="" aria-label="Copy password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <button type="button" class="demo-autofill-btn" id="demo-autofill-btn">Autofill demo login</button>
            </div>

            <!-- Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username_or_email" class="form-label required">Username or email</label>
                    <input type="text"
                           id="username_or_email"
                           name="username_or_email"
                           class="form-input"
                           placeholder="john or john@university.edu"
                           required
                           autocomplete="username">
                    <span class="form-error hidden" id="username_error"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label required">Password</label>
                    <div class="password-field-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-input"
                               placeholder="Enter your password"
                               required
                               autocomplete="current-password">
                        <button type="button"
                                class="password-toggle-btn"
                                id="password-toggle-btn"
                                aria-label="Show password"
                                aria-pressed="false">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="form-error hidden" id="password_error"></span>
                </div>
                
                <!-- Remember me + forgot password -->
                <div class="auth-remember-row">
    <div class="checkbox-group">
        <input type="checkbox" id="remember_me" name="remember_me">
        <label for="remember_me">Remember me</label>
    </div>
    <a href="/student/reset-password" class="forgot-password-link">Forgot password?</a>
</div>



                <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
                    Log in
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider"><span>or</span></div>

            <!-- Google -->
            <button class="google-btn" id="google-login-btn">
                <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google logo">
                Continue with Google
            </button>

            <!-- Footer -->
            <div class="auth-footer">
                Don't have an account? <a href="/student/register">Create one free</a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/utils.js') }}"></script>
    <script>
document.addEventListener("DOMContentLoaded", async () => {
    // Auth-flow-audit fix: surface the ?error= query param that
    // google_callback() (auth.py) redirects here with on OAuth failure.
    // Previously this was never read at all, so a failed Google sign-in
    // silently dropped the user back on a blank login page with zero
    // explanation — including the new account_exists_use_password case
    // (Finding #2's fix), where the account genuinely exists but was
    // created via password, not Google, and the user needs to know to
    // use their password instead of retrying Google.
    const oauthError = new URLSearchParams(window.location.search).get('error');
    if (oauthError && typeof showToast === 'function') {
        const oauthErrorMessages = {
            oauth_failed: 'Google sign-in failed. Please try again or log in with your password.',
            account_exists_use_password: 'An account already exists for that email. Please log in with your password.',
        };
        showToast(oauthErrorMessages[oauthError] || 'Google sign-in failed. Please try again.', 'error', 7000);
        // Strip the query param so a page refresh doesn't re-show the toast.
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Prefill email from Google OAuth if available
    try {
        const result = await api.get("/google_temp_info");
        const data = result.data || result;
        if (data.email) {
            document.getElementById("username_or_email").value = data.email;
            if (typeof showToast === 'function') showToast("Email prefilled from Google", "info");
        }
    } catch (e) { /* no-op */ }

    // Google button
    const googleBtn = document.getElementById("google-login-btn");
    if (googleBtn) {
        googleBtn.addEventListener("click", () => {
            window.location.href = "/google/start";
        });
    }

    // Form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await handleLogin(e);
    });

    // Auto-focus
    document.getElementById('username_or_email').focus();

    // Demo credentials: copy + autofill
    // NOTE: swap DEMO_USERNAME / DEMO_PASSWORD for your real sandboxed
    // demo account. Don't reuse a real user's credentials here — create
    // one dedicated demo account with a unique password and no write
    // access to anything you don't want a stranger touching.
    const DEMO_USERNAME = 'john.doe';
    const DEMO_PASSWORD = 'password123';

    document.getElementById('demo-password').textContent = '•'.repeat(DEMO_PASSWORD.length);

    document.querySelectorAll('.demo-copy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const targetId = btn.dataset.copyTarget;
            const value = targetId === 'demo-password' ? DEMO_PASSWORD : DEMO_USERNAME;
            try {
                await navigator.clipboard.writeText(value);
                const original = btn.innerHTML;
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                setTimeout(() => { btn.innerHTML = original; }, 1200);
                if (typeof showToast === 'function') showToast('Copied to clipboard', 'success', 1500);
            } catch (e) { /* clipboard unavailable, no-op */ }
        });
    });

    document.getElementById('demo-autofill-btn').addEventListener('click', () => {
        document.getElementById('username_or_email').value = DEMO_USERNAME;
        document.getElementById('password').value = DEMO_PASSWORD;
        if (typeof showToast === 'function') showToast('Demo credentials filled in', 'info', 1500);
    });

    // Password toggle
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('password-toggle-btn');
    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleBtn.querySelector('.icon-eye').classList.toggle('hidden', isHidden);
            toggleBtn.querySelector('.icon-eye-off').classList.toggle('hidden', !isHidden);
            toggleBtn.setAttribute('aria-pressed', String(isHidden));
            toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });
    }
});

async function handleLogin(e) {
    clearAllErrors();

    const formData = new FormData(e.target);
    const data = {
        username_or_email: formData.get('username_or_email').trim().toLowerCase(),
        password: formData.get('password')
    };

    if (!data.username_or_email) { showFieldError('username', 'Username or email is required'); return; }
    if (!data.password)          { showFieldError('password', 'Password is required'); return; }

    const submitBtn = document.getElementById('submit-btn');

    try {
        setButtonLoading(submitBtn, true, 'Logging in...');
        const result = await api.post('/login', data);

        if (result.status === 'success') {
            if (typeof showToast === 'function') showToast('Welcome back! Redirecting...', 'success');
            await clearGoogleSession();
            setTimeout(() => {
                window.location.href = result.data?.redirect || '/student/profile/homepage';
            }, 1000);
        } else {
            throw new Error(result.message || 'Login failed');
        }
    } catch (error) {
        setButtonLoading(submitBtn, false);
        const msg = error.message || 'Login failed. Please try again.';

        if (msg.includes('Invalid credentials')) {
            if (typeof showToast === 'function') showToast('Invalid username/email or password', 'error');
            showFieldError('password', 'Incorrect password');
        } else if (msg.includes('verify your email')) {
            if (typeof showToast === 'function') showToast('Please verify your email first. Check your inbox.', 'warning', 5000);
        } else if (msg.includes('complete your registration')) {
            if (typeof showToast === 'function') showToast('Please complete your registration', 'warning');
        } else {
            if (typeof showToast === 'function') showToast(msg, 'error');
            else alert(msg);
        }
    }
}

function showFieldError(fieldName, message) {
    const inputId = fieldName === 'username' ? 'username_or_email' : fieldName;
    const input = document.getElementById(inputId);
    const errorEl = document.getElementById(fieldName + '_error');
    if (input)   input.classList.add('error');
    if (errorEl) { errorEl.classList.remove('hidden'); errorEl.textContent = message; }
}

function clearAllErrors() {
    document.querySelectorAll('.form-error').forEach(el => { el.classList.add('hidden'); el.textContent = ''; });
    document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
}

function setButtonLoading(button, loading, text = '') {
    if (loading) {
        button.disabled = true;
        button.dataset.originalText = button.textContent;
        button.textContent = text || 'Loading...';
    } else {
        button.disabled = false;
        button.textContent = button.dataset.originalText || 'Log in';
    }
}

async function clearGoogleSession() {
    try { await api.post("/clear-session", {}); } catch (e) { /* no-op */ }
}
    </script>
</body>
</html>
